services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forgekit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forgekit"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://forge:forge@db:5432/forgekit
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
